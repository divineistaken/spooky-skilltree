<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0612" />
    <meta
      name="description"
      content="The Pumpkin Codex — a spooky animated JavaScript skill tree."
    />
    <title>🎃 The Pumpkin Codex — Haunted Skill Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>"
    />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="fog" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud__brand">
        <span class="pumpkin">🎃</span>
        <div>
          <h1 class="hud__title">The Pumpkin Codex</h1>
          <p class="hud__sub" id="subtitle">A haunted skill tree</p>
        </div>
      </div>

      <div class="hud__stats">
        <div class="stat" title="Unspent skill points">
          <span class="stat__label">Skill Points</span>
          <span class="stat__value" id="points">0</span>
        </div>
        <div class="stat stat--xp">
          <span class="stat__label"
            >Level <b id="level">1</b> · <span id="xpText">0 / 100</span></span
          >
          <div class="xpbar"><i id="xpFill"></i></div>
        </div>
        <div class="stat" title="Skills unlocked">
          <span class="stat__label">Unlocked</span>
          <span class="stat__value" id="unlockedCount">0 / 0</span>
        </div>
      </div>

      <div class="hud__actions">
        <button id="soundBtn" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">
          🔊
        </button>
        <button id="resetBtn" class="ghost-btn" title="Reset all progress">Reset</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <svg id="lines" class="lines" aria-hidden="true"></svg>
      <div id="nodes" class="nodes"></div>
    </main>

    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

    <footer class="foot">
      <span
        >Hover a node to read its curse · Click to unlock · Progress saves
        automatically</span
      >
      <span class="foot__ghost">🕸️</span>
    </footer>

    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="burst" class="burst" aria-hidden="true"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
